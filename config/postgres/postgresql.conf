# ===========================================================================
# PostgreSQL 16 - Odoo workload
# ===========================================================================
# Sized for a 8 GB / 4 vCPU host. RE-TUNE per server: the values below are a
# documented starting point, not a universal answer. Confirm real memory with
# `free -h` and real CPU with `nproc` on each target before promoting.
# ===========================================================================

# --- Connections ----------------------------------------------------------
# Odoo opens db_maxconn per worker. max_connections must exceed
# (workers x db_maxconn) + cron threads + admin headroom.
listen_addresses = '*'
max_connections = 150
superuser_reserved_connections = 3

# --- Memory ---------------------------------------------------------------
# shared_buffers ~ 25% of RAM.
shared_buffers = 2GB
# effective_cache_size is an estimate the planner uses, not an allocation.
effective_cache_size = 6GB
# Per-operation, and a query can use several. Keep modest with 150 connections.
work_mem = 16MB
maintenance_work_mem = 512MB

# --- Write-ahead log ------------------------------------------------------
# WAL archiving is what makes point-in-time recovery possible. Without it a
# backup can only restore to the moment the dump was taken.
wal_level = replica
max_wal_size = 4GB
min_wal_size = 1GB
checkpoint_completion_target = 0.9
archive_mode = on
archive_command = 'test ! -f /var/lib/postgresql/wal_archive/%f && cp %p /var/lib/postgresql/wal_archive/%f'
archive_timeout = 300

# --- Planner --------------------------------------------------------------
# SSD-backed storage: random reads cost close to sequential reads.
random_page_cost = 1.1
effective_io_concurrency = 200

# --- Autovacuum -----------------------------------------------------------
# Odoo churns rows heavily. Default autovacuum is too passive and bloat grows.
autovacuum = on
autovacuum_max_workers = 4
autovacuum_naptime = 30s
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02

# --- Logging --------------------------------------------------------------
# stderr so Docker captures it and promtail ships it to Loki.
log_destination = 'stderr'
logging_collector = off
log_min_duration_statement = 1000
log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on
log_temp_files = 0
log_autovacuum_min_duration = 0
log_line_prefix = '%m [%p] %q%u@%d '
log_timezone = 'UTC'
timezone = 'UTC'

# --- Statistics -----------------------------------------------------------
# pg_stat_statements is what makes "which query is slow" answerable.
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 10000
pg_stat_statements.track = top
track_activities = on
track_counts = on
track_io_timing = on
