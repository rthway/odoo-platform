# ===========================================================================
# Security response headers
# ===========================================================================
# `always` matters: without it nginx omits the header on error responses,
# which are exactly the responses an attacker is most interested in.
# ===========================================================================

# HSTS. Only meaningful over HTTPS. Do NOT add `preload` until the domain is
# final and permanently HTTPS - preload lists are painful to leave.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Block MIME sniffing.
add_header X-Content-Type-Options "nosniff" always;

# Clickjacking. SAMEORIGIN rather than DENY: Odoo embeds its own iframes.
add_header X-Frame-Options "SAMEORIGIN" always;

# Limit referrer leakage to third parties.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Drop access to hardware APIs Odoo does not use.
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;

# NOTE: Content-Security-Policy is deliberately NOT set here.
# Odoo's web client relies on inline scripts and eval; a naive CSP breaks the
# backend UI outright. Introducing one requires a report-only rollout first.
# Tracked as a documented improvement in docs/security.md.
