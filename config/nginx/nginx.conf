# ===========================================================================
# nginx - reverse proxy and TLS terminator for Odoo
# ===========================================================================
# nginx is the ONLY ingress. Odoo and PostgreSQL publish no ports of their
# own, so everything that reaches the application passes through here.
# ===========================================================================

user  nginx;
# auto == number of CPU cores available to the container.
worker_processes  auto;
worker_rlimit_nofile 65535;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # --- Logging ----------------------------------------------------------
    # JSON so promtail ships structured fields to Loki instead of a blob that
    # has to be regex-parsed at query time.
    log_format json_combined escape=json
        '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"request_method":"$request_method",'
        '"request_uri":"$request_uri",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_response_time":"$upstream_response_time",'
        '"upstream_status":"$upstream_status",'
        '"http_referer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"http_x_forwarded_for":"$http_x_forwarded_for"'
        '}';

    access_log /var/log/nginx/access.log json_combined;

    # --- Transfer ---------------------------------------------------------
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    # Do not advertise the nginx version in responses or error pages.
    server_tokens   off;

    # Odoo uploads (attachments, imports) need room. 0 would disable the
    # limit entirely, which is an easy denial-of-service; 100m is deliberate.
    client_max_body_size 100m;
    client_body_buffer_size 128k;
    client_body_timeout 60s;
    client_header_timeout 60s;
    send_timeout 60s;

    # --- Compression ------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml+rss
        application/rss+xml application/atom+xml image/svg+xml;

    # --- Rate limiting ----------------------------------------------------
    # A dedicated, much tighter zone for authentication, because /web/login is
    # where credential stuffing lands. General traffic gets a looser zone.
    limit_req_zone $binary_remote_addr zone=odoo_general:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=odoo_login:10m   rate=6r/m;
    limit_conn_zone $binary_remote_addr zone=odoo_conn:10m;

    # --- Upstreams --------------------------------------------------------
    # `odoo` resolves on the compose backend network.
    upstream odoo_app {
        server odoo:8069;
        keepalive 32;
    }

    # Longpolling / websocket traffic goes to the gevent port, not 8069.
    upstream odoo_chat {
        server odoo:8072;
        keepalive 32;
    }

    # --- Local status endpoint for the container healthcheck --------------
    server {
        listen 8081;
        server_name _;
        access_log off;

        location = /stub_status {
            stub_status;
            allow 127.0.0.1;
            deny all;
        }
    }

    include /etc/nginx/conf.d/*.conf;
}
