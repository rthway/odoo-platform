# ===========================================================================
# nginx on OPS - TLS front end for Grafana
# ===========================================================================
# Separate from config/nginx/nginx.conf because that file declares an
# `upstream odoo` block. nginx resolves upstream names at START-UP, so the
# application config on the OPS host would simply refuse to start.
#
# This proxies GRAFANA ONLY. Prometheus and Alertmanager stay bound to
# localhost: Grafana has real authentication (admin account, sign-up and
# anonymous access disabled), and they have none at all.
# ===========================================================================

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format json_combined escape=json
        '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"request_method":"$request_method",'
        '"request_uri":"$request_uri",'
        '"status":$status,'
        '"request_time":$request_time,'
        '"http_user_agent":"$http_user_agent"'
        '}';
    access_log /var/log/nginx/access.log json_combined;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;
    server_tokens   off;

    client_max_body_size 32m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # Grafana's login form is a credential-stuffing target like any other.
    limit_req_zone $binary_remote_addr zone=grafana_login:10m rate=6r/m;
    limit_req_zone $binary_remote_addr zone=grafana_general:10m rate=30r/s;

    upstream grafana_app {
        server grafana:3000;
        keepalive 16;
    }

    include /etc/nginx/conf.d/*.conf;
}
