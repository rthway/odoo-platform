---
# ===========================================================================
# Build - the single point where an image is created
# ===========================================================================
# THE artifact. Everything downstream promotes what this workflow produced;
# no environment ever rebuilds. That is what makes "what QA tested is what
# PROD runs" a fact rather than a hope.
#
# The image is scanned BEFORE it is pushed, so a CRITICAL vulnerability never
# reaches the registry where someone could deploy it by hand.
# ===========================================================================
name: Build

on:
  # ONLY `dev` builds. qa and main promote the artifact that was built here,
  # they never rebuild it - which is what makes "the image QA tested is the
  # image production runs" true rather than merely intended. A hotfix that
  # never passed through dev needs an explicit workflow_dispatch build.
  push:
    branches: [dev]
    tags: ["v*.*.*"]
  workflow_dispatch:
  # Called by deploy workflows that need an image built from a given ref.
  workflow_call:
    outputs:
      image-tag:
        description: "Immutable tag that was built and pushed"
        value: ${{ jobs.build.outputs.image-tag }}
      image-digest:
        description: "Digest of the pushed image"
        value: ${{ jobs.build.outputs.image-digest }}

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: docker.io
  IMAGE_NAME: ${{ vars.DOCKERHUB_NAMESPACE || 'rthway' }}/odoo-platform

jobs:

  build:
    name: Build, scan and push
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
      id-token: write
      attestations: write
    outputs:
      image-tag: ${{ steps.meta.outputs.image-tag }}
      image-digest: ${{ steps.push.outputs.digest }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # -------------------------------------------------------------------
      # Immutable tag: <calendar version>-<short sha>. Encodes when it was
      # built and exactly which commit it came from, so production can always
      # answer "what is running?" with a commit, not a guess.
      # -------------------------------------------------------------------
      - name: Compute image metadata
        id: meta
        run: |
          set -euo pipefail
          SHORT_SHA="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          CAL_VER="$(date -u +%Y.%m.%d)"
          IMAGE_TAG="${CAL_VER}-${SHORT_SHA}"
          {
            echo "image-tag=${IMAGE_TAG}"
            echo "short-sha=${SHORT_SHA}"
            echo "build-date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"
          echo "### Image \`${IMAGE_NAME}:${IMAGE_TAG}\`" >> "$GITHUB_STEP_SUMMARY"

      # -------------------------------------------------------------------
      # Build to a local tarball first. An image that fails its scan must
      # never exist in the registry.
      # -------------------------------------------------------------------
      - name: Build (local, not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/odoo/Dockerfile
          load: true
          push: false
          tags: ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.image-tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          build-args: |
            BUILD_DATE=${{ steps.meta.outputs.build-date }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ steps.meta.outputs.image-tag }}

      - name: Verify OCI labels were applied
        run: |
          set -euo pipefail
          img="${IMAGE_NAME}:${{ steps.meta.outputs.image-tag }}"
          revision=$(docker inspect -f '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$img")
          version=$(docker inspect -f '{{ index .Config.Labels "org.opencontainers.image.version" }}' "$img")
          echo "revision=$revision version=$version"
          # Provenance is the point of the labels; an empty one is a failure.
          [ "$revision" = "${{ github.sha }}" ] || { echo "revision label does not match the commit"; exit 1; }
          [ -n "$version" ] || { echo "version label is empty"; exit 1; }

      - name: Confirm the container does not run as root
        run: |
          set -euo pipefail
          user=$(docker inspect -f '{{ .Config.User }}' "${IMAGE_NAME}:${{ steps.meta.outputs.image-tag }}")
          echo "image user: ${user:-<empty = root>}"
          # An explicit if, not `A && B || C`: that construct is not
          # if-then-else, and C also runs when A succeeds but B fails.
          if [ -z "$user" ] || [ "$user" = "root" ] || [ "$user" = "0" ]; then
            echo "image would run as root"
            exit 1
          fi

      # -------------------------------------------------------------------
      # Scan gate
      # -------------------------------------------------------------------
      - name: Trivy scan (SARIF for the Security tab)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.image-tag }}
          format: sarif
          output: trivy-image.sarif
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: "0"

      - name: Upload scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      - name: Enforce the vulnerability policy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.image-tag }}
          format: table
          severity: CRITICAL,HIGH
          # ignore-unfixed: an unfixable CVE in the upstream Odoo base image
          # cannot be resolved by failing this build. Those are tracked in the
          # Security tab and reviewed weekly, per docs/security.md.
          ignore-unfixed: true
          exit-code: "1"

      - name: Generate an SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.image-tag }}
          format: cyclonedx
          output: sbom.cdx.json
          exit-code: "0"

      - name: Publish scan artefacts
        uses: actions/upload-artifact@v4
        with:
          name: security-${{ steps.meta.outputs.image-tag }}
          path: |
            trivy-image.sarif
            sbom.cdx.json
          retention-days: 90

      # -------------------------------------------------------------------
      # Push only after every gate above has passed.
      # -------------------------------------------------------------------
      # Publishing is conditional on credentials being configured. Without
      # them the build and every scan gate still run on each push - which is
      # most of the value - rather than the pipeline sitting permanently red
      # and training everyone to ignore it.
      - name: Check whether Docker Hub credentials are configured
        id: registry
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::DOCKERHUB_USERNAME is not set - the image was built and scanned but NOT published. Nothing can be deployed until it is."
          fi

      - name: Log in to Docker Hub
        if: steps.registry.outputs.configured == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          # A Docker Hub ACCESS TOKEN, scoped read/write, never the account
          # password. Revocable without changing the account credentials.
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push
        id: push
        if: steps.registry.outputs.configured == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/odoo/Dockerfile
          push: true
          # The immutable tag is the contract. `latest` is published only from
          # main as a convenience for humans; nothing deploys from it, and
          # deploy.sh refuses it outright.
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.image-tag }}
            ${{ env.IMAGE_NAME }}:sha-${{ steps.meta.outputs.short-sha }}
            ${{ github.ref == 'refs/heads/main' && format('{0}:latest', env.IMAGE_NAME) || '' }}
          cache-from: type=gha
          build-args: |
            BUILD_DATE=${{ steps.meta.outputs.build-date }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ steps.meta.outputs.image-tag }}

      - name: Attest build provenance
        if: steps.registry.outputs.configured == 'true'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Summary
        run: |
          {
            echo "| field | value |"
            echo "|---|---|"
            echo "| image | \`${IMAGE_NAME}:${{ steps.meta.outputs.image-tag }}\` |"
            echo "| commit | \`${{ github.sha }}\` |"
            if [ "${{ steps.registry.outputs.configured }}" = "true" ]; then
              echo "| digest | \`${{ steps.push.outputs.digest }}\` |"
              echo "| published | yes |"
              echo ""
              echo "Deploy with: \`scripts/deploy.sh -e dev -t ${{ steps.meta.outputs.image-tag }}\`"
            else
              echo "| published | **NO** |"
              echo ""
              echo "Built and scanned, but not published: DOCKERHUB_USERNAME and"
              echo "DOCKERHUB_TOKEN are not configured. Nothing can be deployed"
              echo "until they are - see docs/ci-cd.md."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
