---
# ===========================================================================
# Security scanning
# ===========================================================================
# Runs on pull requests, on main/develop, and on a weekly schedule.
#
# The schedule matters as much as the PR trigger: a vulnerability disclosed
# after a commit merges will never be found by a push-triggered scan alone.
# ===========================================================================
name: Security

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # 03:00 UTC every Monday.
    - cron: "0 3 * * 1"
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:

  # -----------------------------------------------------------------------
  # Secret detection. This is the one scan that must never be advisory:
  # a leaked credential in git history cannot be un-leaked by a later commit.
  # -----------------------------------------------------------------------
  gitleaks:
    name: Secret detection (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: a secret committed and later removed is still in
          # the history and still compromised. depth 1 would miss it.
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          config-path: .gitleaks.toml

  # -----------------------------------------------------------------------
  # Static analysis. Guarded: CodeQL fails outright when a language has no
  # source, and addons/ is empty until the first custom module lands.
  # -----------------------------------------------------------------------
  detect-languages:
    name: Detect analysable languages
    runs-on: ubuntu-latest
    outputs:
      has-python: ${{ steps.detect.outputs.has-python }}
    steps:
      - uses: actions/checkout@v4
      - id: detect
        run: |
          if [ -n "$(find . -name '*.py' -not -path './.git/*' -print -quit)" ]; then
            echo "has-python=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-python=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Python sources yet - CodeQL will be skipped until addons/ has modules."
          fi

  codeql:
    name: CodeQL
    needs: detect-languages
    if: needs.detect-languages.outputs.has-python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [python]
    steps:
      - uses: actions/checkout@v4

      - name: Initialise CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # security-and-quality is broader than the default security-extended
          # and is affordable on a codebase this size.
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Analyse
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

  # -----------------------------------------------------------------------
  # Filesystem, dependency and IaC scanning.
  # -----------------------------------------------------------------------
  trivy-fs:
    name: Trivy (filesystem, config, secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Scan the filesystem
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy-fs.sarif
          severity: CRITICAL,HIGH,MEDIUM
          # Report everything to the Security tab; the gate below decides
          # what actually blocks a merge.
          exit-code: "0"

      - name: Upload results to the Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

      # The policy gate. Documented in docs/security.md:
      #   CRITICAL -> block, always
      #   HIGH     -> block when a fix is available
      #   MEDIUM   -> report only
      - name: Enforce the vulnerability policy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  # -----------------------------------------------------------------------
  # Flags dependencies a pull request would newly introduce, before merge.
  # -----------------------------------------------------------------------
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: always

  # -----------------------------------------------------------------------
  security-passed:
    name: Security passed
    runs-on: ubuntu-latest
    needs: [gitleaks, codeql, trivy-fs]
    if: always()
    steps:
      - name: Verify required scans succeeded
        run: |
          # 'skipped' is acceptable only for CodeQL, which is legitimately
          # skipped while there is no Python to analyse.
          gitleaks='${{ needs.gitleaks.result }}'
          codeql='${{ needs.codeql.result }}'
          trivy='${{ needs.trivy-fs.result }}'
          echo "gitleaks=$gitleaks codeql=$codeql trivy-fs=$trivy"

          fail=0
          [ "$gitleaks" = "success" ] || { echo "gitleaks did not pass"; fail=1; }
          [ "$trivy" = "success" ]    || { echo "trivy-fs did not pass"; fail=1; }
          case "$codeql" in
            success|skipped) ;;
            *) echo "codeql did not pass"; fail=1 ;;
          esac
          exit $fail
