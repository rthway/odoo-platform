---
# ===========================================================================
# Deploy to QA / UAT (157.10.100.230)
# ===========================================================================
# QA runs the EXACT tag that was validated in DEV. This workflow has no build
# step at all - that absence is the guarantee.
#
# QA is where integration and functional tests run, because it is the first
# environment configured like production: multi-worker, list_db disabled,
# addons from the image only, and its own database that PROD never shares.
# ===========================================================================
name: Deploy QA

on:
  # Merging into `qa` promotes to the QA server. Still no build step: the
  # image was built when the commit was on `dev`, and resolve-image finds it.
  push:
    branches: [qa]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag validated in DEV. Empty = resolve from the commit."
        required: false
        type: string
      skip_integration_tests:
        description: "Skip integration tests (emergency use only)"
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-qa
  cancel-in-progress: false

permissions:
  contents: read

jobs:

  resolve-image:
    name: Resolve and verify the image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      # Full history: resolving walks back through ancestors.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A merge into `qa` creates a NEW commit that Build never saw, so
      # sha-<that commit> does not exist. The artifact to promote is the one
      # built for the dev commit merged in, so walk ancestors until a
      # published sha- tag turns up. Promotion stays byte-exact: QA runs the
      # image DEV tested, never a rebuild of the same source.
      - name: Confirm the tag is published
        id: resolve
        env:
          IMAGE: ${{ vars.DOCKERHUB_NAMESPACE || 'rthway' }}/odoo-platform
          GIVEN: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          if [ -n "${GIVEN}" ]; then
            TAG="${GIVEN}"
          else
            TAG=""
            for sha in $(git rev-list --max-count=50 HEAD); do
              cand="sha-$(echo "${sha}" | cut -c1-7)"
              if docker manifest inspect "docker.io/${IMAGE}:${cand}" >/dev/null 2>&1; then
                TAG="${cand}"; echo "resolved ${TAG} from ${sha}"; break
              fi
            done
            [ -n "${TAG}" ] || {
              echo "::error::No published image for the last 50 ancestors of $(git rev-parse HEAD). Nothing here was built on dev."
              exit 1; }
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          [ "$TAG" != "latest" ] || { echo "refusing to promote the mutable tag 'latest'"; exit 1; }
          # Promoting a tag that does not exist should fail here, in seconds,
          # rather than half-way through a deployment on the QA host.
          if ! docker manifest inspect "docker.io/${IMAGE}:${TAG}" > /dev/null 2>&1; then
            echo "image docker.io/${IMAGE}:${TAG} was not found on Docker Hub"
            echo "Only tags produced by the Build workflow can be promoted."
            exit 1
          fi
          echo "confirmed: docker.io/${IMAGE}:${TAG}"

  deploy:
    name: Deploy to QA
    needs: resolve-image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: qa
      url: ${{ vars.QA_URL }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      # A host that has never been provisioned fails with `cd: No such file
      # or directory` and exit 127, which says nothing useful. Check first and
      # name the fix.
      - name: Verify the host is provisioned
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          APP_DIR: ${{ vars.APP_DIR || '/opt/odoo-platform' }}
        run: |
          set -euo pipefail
          if ! ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
                 "${SSH_USER}@${SSH_HOST}" \
                 "test -x '${APP_DIR}/scripts/deploy.sh'"; then
            echo "::error::${SSH_HOST} is not provisioned: ${APP_DIR}/scripts/deploy.sh is missing."
            echo "Run the 'Provision' workflow for this environment first"
            echo "(dry run by default; tick 'apply' to make changes)."
            exit 1
          fi
          echo "host is provisioned"

      - name: Deploy
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          APP_DIR: ${{ vars.APP_DIR || '/opt/odoo-platform' }}
          IMAGE_TAG: ${{ needs.resolve-image.outputs.tag }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
              "${SSH_USER}@${SSH_HOST}" \
              "cd '${APP_DIR}' && ./scripts/deploy.sh -e qa -t '${IMAGE_TAG}'"

      # -------------------------------------------------------------------
      - name: Integration tests
        if: ${{ !inputs.skip_integration_tests }}
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          APP_DIR: ${{ vars.APP_DIR || '/opt/odoo-platform' }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes \
              "${SSH_USER}@${SSH_HOST}" \
              "cd '${APP_DIR}' && ./tests/test-integration.sh -e qa"

      - name: Odoo module tests
        if: ${{ !inputs.skip_integration_tests }}
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          APP_DIR: ${{ vars.APP_DIR || '/opt/odoo-platform' }}
        run: |
          set -euo pipefail
          # Odoo's own test runner against the QA database, in a throwaway
          # container so a failing test cannot leave QA half-updated.
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes \
              "${SSH_USER}@${SSH_HOST}" \
              "cd '${APP_DIR}' && ./tests/test-odoo-modules.sh -e qa"

      - name: Functional smoke test from the runner
        if: vars.QA_URL != ''
        env:
          QA_URL: ${{ vars.QA_URL }}
        run: |
          set -euo pipefail
          echo "checking QA is reachable and serving"
          serving=0
          for i in $(seq 1 10); do
            code=$(curl -sk -o /dev/null -w '%{http_code}' --max-time 15 "${QA_URL}/web/login" || echo 000)
            echo "attempt $i: HTTP $code"
            # An explicit if, not `A || B && break`: under `set -e` that
            # compound returns non-zero on no match and aborts the step.
            if [ "$code" = "200" ] || [ "$code" = "303" ]; then
              serving=1
              break
            fi
            sleep 10
          done
          [ "$serving" = "1" ] || { echo "QA is not serving"; exit 1; }

          # The database manager must be unreachable in QA, exactly as in
          # production. If this ever returns 200, QA is misconfigured and is
          # no longer a faithful rehearsal.
          dbcode=$(curl -sk -o /dev/null -w '%{http_code}' --max-time 15 "${QA_URL}/web/database/manager" || echo 000)
          echo "database manager returned HTTP $dbcode (expected 404/403)"
          case "$dbcode" in
            200) echo "SECURITY: the database manager is exposed in QA"; exit 1 ;;
          esac

      - name: Summary
        if: always()
        run: |
          {
            echo "### QA deployment"
            echo ""
            echo "- tag: \`${{ needs.resolve-image.outputs.tag }}\` (same image as DEV, not rebuilt)"
            echo "- integration tests: ${{ inputs.inputs.skip_integration_tests && 'SKIPPED' || 'run' }}"
            echo "- result: ${{ job.status }}"
            echo ""
            if [ "${{ job.status }}" = "success" ]; then
              echo "Ready for production approval: run **Deploy PROD** with this exact tag."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
