---
# ===========================================================================
# Provision - run Ansible against the servers
# ===========================================================================
# Ansible has no Windows control node, so provisioning cannot run from an
# operator's workstation here. Rather than require a separate Linux jump box,
# the pipeline is the control node: a Linux runner, the same SSH deploy keys
# the deployment workflows already use, and secrets that never touch a disk
# anyone shares.
#
# DEFAULTS TO --check. A run that changes a server has to be asked for
# explicitly, which makes "I did not mean to run that against production" a
# much harder mistake to make.
# ===========================================================================
name: Provision

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Which host to provision"
        required: true
        type: choice
        options: [dev, qa, ops, production]
      apply:
        description: "Apply changes. Leave unticked for a dry run (--check --diff)."
        required: false
        default: false
        type: boolean
      tags:
        description: "Limit to specific Ansible tags (optional, e.g. firewall)"
        required: false
        default: ""
        type: string

concurrency:
  # Never two Ansible runs against the same host: they interleave and leave
  # it in a state neither run intended.
  group: provision-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:

  provision:
    name: "${{ inputs.apply && 'APPLY' || 'Dry run' }} - ${{ inputs.environment }}"
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Production carries the required-reviewer rule, so applying to it needs
    # an approval exactly as a deployment does.
    environment: ${{ inputs.environment }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Ansible
        run: |
          set -euo pipefail
          pip install --quiet ansible-core

          # Galaxy returns 5xx often enough that a single attempt makes
          # provisioning flaky for reasons that have nothing to do with the
          # change being deployed. Retry with a short backoff.
          for attempt in 1 2 3 4 5; do
            if ansible-galaxy collection install -r infrastructure/ansible/requirements.yml; then
              echo "collections installed on attempt $attempt"
              exit 0
            fi
            echo "::warning::galaxy install attempt $attempt failed, retrying"
            sleep $(( attempt * 10 ))
          done
          echo "::error::could not install Ansible collections after 5 attempts"
          exit 1

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Build the inventory
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          TARGET: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          cd infrastructure/ansible
          cp inventory/hosts.example.ini inventory/hosts.ini

          # The example inventory carries the right structure and the right
          # internal addresses; only the routable address and the account
          # come from secrets, so neither is committed.
          sed -i "s/^ansible_user=.*/ansible_user=${SSH_USER}/" inventory/hosts.ini

          # Map the GitHub environment name onto the Ansible group.
          case "$TARGET" in
            production) GROUP=prod ;;
            *)          GROUP="$TARGET" ;;
          esac
          echo "ANSIBLE_LIMIT=$GROUP" >> "$GITHUB_ENV"
          echo "provisioning group: $GROUP"

      - name: Show what will be targeted
        working-directory: infrastructure/ansible
        run: |
          ansible-inventory --list --yaml --limit "$ANSIBLE_LIMIT" | head -40
          # `-o` on ansible means --one-line, not an ssh option; passing
          # StrictHostKeyChecking here made it exit with "unrecognized
          # arguments". Host key checking is already on via ansible.cfg and
          # the pinned known_hosts written above.
          ansible "$ANSIBLE_LIMIT" -m ping --private-key ~/.ssh/id_deploy || true

      - name: Run the playbook
        working-directory: infrastructure/ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: "True"
          # Secrets are passed as extra-vars from the environment, so they
          # exist only in the runner's memory for the length of the run.
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          ODOO_ADMIN_PASSWD: ${{ secrets.ODOO_ADMIN_PASSWD }}
          GRAFANA_ADMIN_USER: ${{ secrets.GRAFANA_ADMIN_USER }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          APPLY: ${{ inputs.apply }}
          TAGS: ${{ inputs.tags }}
        run: |
          set -euo pipefail

          MODE=(--check --diff)
          if [ "$APPLY" = "true" ]; then
            MODE=()
            echo "::warning::APPLYING changes to ${{ inputs.environment }}"
          else
            echo "Dry run: --check --diff. Nothing will be changed."
          fi

          EXTRA=()
          [ -n "${TAGS}" ] && EXTRA+=(--tags "${TAGS}")

          # shellcheck disable=SC2086
          ansible-playbook site.yml \
            --limit "$ANSIBLE_LIMIT" \
            --private-key ~/.ssh/id_deploy \
            -e "postgres_password=${POSTGRES_PASSWORD}" \
            -e "odoo_admin_passwd=${ODOO_ADMIN_PASSWD}" \
            -e "grafana_admin_user=${GRAFANA_ADMIN_USER}" \
            -e "grafana_admin_password=${GRAFANA_ADMIN_PASSWORD}" \
            -e "dockerhub_username=${DOCKERHUB_USERNAME}" \
            -e "dockerhub_token=${DOCKERHUB_TOKEN}" \
            "${MODE[@]}" "${EXTRA[@]+"${EXTRA[@]}"}"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Provision ${{ inputs.environment }}"
            echo ""
            echo "- mode: ${{ inputs.apply && '**APPLIED**' || 'dry run (--check)' }}"
            echo "- tags: ${{ inputs.tags || 'all' }}"
            echo "- result: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
