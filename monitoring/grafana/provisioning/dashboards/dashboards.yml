---
apiVersion: 1

providers:
  - name: odoo-platform
    orgId: 1
    folder: "Odoo Platform"
    type: file
    # Dashboards are code. Disallowing UI deletion stops a dashboard from
    # vanishing without a corresponding commit.
    disableDeletion: true
    # Changes made in the UI are overwritten on the next reload, which keeps
    # the repository the single source of truth.
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
