---
# ===========================================================================
# Alertmanager - routing, grouping and inhibition
# ===========================================================================
# Routing exists to make alerts survivable. Ungrouped alerts during an
# incident produce dozens of notifications in a minute, and people mute the
# channel - which is the failure mode this configuration is designed to avoid.
#
# Secrets (webhook URLs, SMTP passwords) come from environment substitution
# performed by Ansible when it renders this file. Nothing real is committed.
# ===========================================================================

global:
  resolve_timeout: 5m
  smtp_smarthost: "${SMTP_SMARTHOST}"
  smtp_from: "${SMTP_FROM}"
  smtp_require_tls: true

# ---------------------------------------------------------------------------
templates:
  - /etc/alertmanager/templates/*.tmpl

# ---------------------------------------------------------------------------
route:
  # Group by alertname AND environment: a DEV outage and a PROD outage of the
  # same rule must never be collapsed into one notification.
  group_by: ["alertname", "environment"]
  # Wait briefly for related alerts before sending. When a server dies, its
  # node, container and probe alerts all fire within seconds; this turns
  # three notifications into one.
  group_wait: 30s
  group_interval: 5m
  # Do not re-notify for 4 hours unless something changes. Shorter intervals
  # train people to ignore the channel.
  repeat_interval: 4h
  receiver: default

  # ORDER MATTERS. Alertmanager takes the FIRST matching route, so the most
  # specific exclusions must come first. Verified with `amtool config routes
  # test`; an earlier ordering here sent DEV criticals to the paging receiver
  # and sent production backup alerts to the on-call channel.
  routes:
    # -------------------------------------------------------------------
    # DEV first, unconditionally. DEV is expected to break - that is what it
    # is for - and it must never page anyone, whatever the severity.
    - matchers:
        - environment = "dev"
      receiver: low-priority
      group_wait: 5m
      repeat_interval: 24h

    # -------------------------------------------------------------------
    # Backup alerts before the severity routes. They are urgent but they are
    # not an outage: nobody should be woken for one, and equally they must
    # not sit unread for days in a general channel.
    - matchers:
        - alertname =~ "Backup.*"
      receiver: backup-alerts
      group_wait: 1m
      repeat_interval: 12h

    # -------------------------------------------------------------------
    # Production criticals page immediately and repeat aggressively.
    - matchers:
        - severity = "critical"
        - environment = "prod"
      receiver: critical-prod
      group_wait: 10s
      repeat_interval: 1h

    # -------------------------------------------------------------------
    # Criticals in every other environment (QA, OPS).
    - matchers:
        - severity = "critical"
      receiver: critical
      repeat_interval: 2h

    - matchers:
        - severity = "warning"
      receiver: warnings

    - matchers:
        - severity = "info"
      receiver: low-priority
      repeat_interval: 24h

# ---------------------------------------------------------------------------
# Inhibition - suppress alerts whose cause is already being reported.
# ---------------------------------------------------------------------------
inhibit_rules:
  # A dead server produces an Odoo alert, a Postgres alert and container
  # alerts. Report the server; suppress the consequences.
  - source_matchers:
      - alertname = "ServerDown"
    target_matchers:
      - severity =~ "warning|critical"
    equal: ["instance_name"]

  # If PostgreSQL is down, Odoo being down is a symptom, not news.
  - source_matchers:
      - alertname = "PostgreSQLDown"
    target_matchers:
      - alertname =~ "Odoo.*"
    equal: ["environment"]

  # Never send the warning-level twin of a critical that is already firing.
  - source_matchers:
      - severity = "critical"
    target_matchers:
      - severity = "warning"
    equal: ["alertname", "environment"]

  # Disk critical supersedes disk warning on the same filesystem.
  - source_matchers:
      - alertname = "DiskSpaceCritical"
    target_matchers:
      - alertname =~ "DiskSpaceLow|DiskWillFillIn24Hours"
    equal: ["instance_name", "mountpoint"]

# ---------------------------------------------------------------------------
receivers:

  - name: default
    email_configs:
      - to: "${ALERT_EMAIL_TO}"
        send_resolved: true

  - name: critical-prod
    email_configs:
      - to: "${ALERT_EMAIL_CRITICAL}"
        send_resolved: true
        headers:
          Subject: "[CRITICAL PROD] {{ .CommonAnnotations.summary }}"
    slack_configs:
      - api_url: "${ALERT_SLACK_WEBHOOK_URL}"
        channel: "${ALERT_SLACK_CHANNEL_CRITICAL}"
        send_resolved: true
        title: "CRITICAL - PRODUCTION"
        text: |
          {{ range .Alerts }}*{{ .Annotations.summary }}*
          {{ .Annotations.description }}
          {{ if .Annotations.runbook }}Runbook: `{{ .Annotations.runbook }}`{{ end }}
          {{ end }}

  - name: critical
    email_configs:
      - to: "${ALERT_EMAIL_TO}"
        send_resolved: true
        headers:
          Subject: "[CRITICAL {{ .CommonLabels.environment }}] {{ .CommonAnnotations.summary }}"
    slack_configs:
      - api_url: "${ALERT_SLACK_WEBHOOK_URL}"
        channel: "${ALERT_SLACK_CHANNEL}"
        send_resolved: true
        title: "CRITICAL - {{ .CommonLabels.environment }}"
        text: |
          {{ range .Alerts }}*{{ .Annotations.summary }}*
          {{ .Annotations.description }}
          {{ end }}

  - name: backup-alerts
    email_configs:
      - to: "${ALERT_EMAIL_TO}"
        send_resolved: true
        headers:
          Subject: "[BACKUP] {{ .CommonAnnotations.summary }}"
    slack_configs:
      - api_url: "${ALERT_SLACK_WEBHOOK_URL}"
        channel: "${ALERT_SLACK_CHANNEL}"
        send_resolved: true
        title: "Backup problem"
        text: |
          {{ range .Alerts }}*{{ .Annotations.summary }}*
          {{ .Annotations.description }}
          {{ if .Annotations.runbook }}Runbook: `{{ .Annotations.runbook }}`{{ end }}
          {{ end }}

  - name: warnings
    slack_configs:
      - api_url: "${ALERT_SLACK_WEBHOOK_URL}"
        channel: "${ALERT_SLACK_CHANNEL}"
        send_resolved: true
        title: "Warning - {{ .CommonLabels.environment }}"
        text: |
          {{ range .Alerts }}{{ .Annotations.summary }}
          {{ end }}

  # Delivered, but never paged. Reviewed on the dashboard.
  - name: low-priority
    slack_configs:
      - api_url: "${ALERT_SLACK_WEBHOOK_URL}"
        channel: "${ALERT_SLACK_CHANNEL_LOW}"
        send_resolved: false
        title: "FYI - {{ .CommonLabels.environment }}"
        text: |
          {{ range .Alerts }}{{ .Annotations.summary }}
          {{ end }}
