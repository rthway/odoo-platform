---
# ===========================================================================
# Blackbox exporter - probes Odoo the way a user reaches it
# ===========================================================================
modules:

  # Odoo health endpoint over plain HTTP (internal probes).
  odoo_http:
    prober: http
    timeout: 10s
    http:
      valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
      # 200 only. A 302 to a login page would mean the health endpoint is
      # not actually answering, and must not read as healthy.
      valid_status_codes: [200]
      method: GET
      preferred_ip_protocol: ip4
      # Do not follow redirects: a redirect IS the failure we want to see.
      follow_redirects: false
      fail_if_not_ssl: false

  # The login page, which proves the ORM registry loaded, not just that a
  # web server is listening.
  odoo_login:
    prober: http
    timeout: 15s
    http:
      valid_status_codes: [200, 303]
      method: GET
      preferred_ip_protocol: ip4
      follow_redirects: true
      fail_if_body_not_matches_regexp:
        - "(?i)(odoo|csrf_token|<form)"

  # HTTPS with certificate validation - production ingress.
  odoo_https:
    prober: http
    timeout: 15s
    http:
      valid_status_codes: [200]
      method: GET
      preferred_ip_protocol: ip4
      fail_if_not_ssl: true
      tls_config:
        insecure_skip_verify: false

  # Certificate expiry. Reports probe_ssl_earliest_cert_expiry even when the
  # certificate has already expired, which is what the alert needs.
  tls_connect:
    prober: tcp
    timeout: 10s
    tcp:
      tls: true
      tls_config:
        insecure_skip_verify: true

  icmp_ping:
    prober: icmp
    timeout: 5s
    icmp:
      preferred_ip_protocol: ip4
