# ===========================================================================
# Observability stack - runs on OPS (157.10.100.232)
# ===========================================================================
# Deployed independently of the application stacks:
#   docker compose -f compose.observability.yml up -d
#
# Monitoring must NOT share a lifecycle with the thing it monitors. If this
# ran alongside Odoo on the production host, the outage that took Odoo down
# would take the dashboards and alerting down with it - exactly when they
# are needed.
#
# Exporters (node_exporter, cAdvisor) run on DEV, QA and PROD; this file
# defines the central collectors that scrape them.
# ===========================================================================

name: odoo-observability

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

services:

  # -----------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:${PROMETHEUS_VERSION:-v3.1.0}
    restart: always
    user: "65534:65534"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}
      - --web.enable-lifecycle
      # Not --web.enable-admin-api: that exposes series deletion, and there
      # is no reason for a dashboard to be able to erase history.
      - --web.external-url=${PROMETHEUS_EXTERNAL_URL:-http://localhost:9090}
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts:/etc/prometheus/alerts:ro
      - prometheus-data:/prometheus
    ports:
      # Bound to localhost. Reached through the OPS reverse proxy or an SSH
      # tunnel - never published to the internet, since Prometheus has no
      # authentication of its own.
      - "${MONITORING_BIND:-127.0.0.1}:${PROMETHEUS_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [observability]
    logging: *default-logging

  # -----------------------------------------------------------------------
  alertmanager:
    image: prom/alertmanager:${ALERTMANAGER_VERSION:-v0.28.0}
    restart: always
    user: "65534:65534"
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.external-url=${ALERTMANAGER_EXTERNAL_URL:-http://localhost:9093}
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    ports:
      - "${MONITORING_BIND:-127.0.0.1}:${ALERTMANAGER_PORT:-9093}:9093"
    networks: [observability]
    logging: *default-logging

  # -----------------------------------------------------------------------
  loki:
    image: grafana/loki:${LOKI_VERSION:-3.3.2}
    restart: always
    user: "10001:10001"
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    ports:
      - "${MONITORING_BIND:-127.0.0.1}:${LOKI_PORT:-3100}:3100"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3100/ready"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks: [observability]
    logging: *default-logging

  # -----------------------------------------------------------------------
  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-11.5.1}
    restart: always
    depends_on: [prometheus, loki]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?set GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      # Nobody signs themselves up to a monitoring system.
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_STRICT_TRANSPORT_SECURITY: "true"
      GF_SECURITY_CONTENT_TYPE_PROTECTION: "true"
      # Phoning home is off: this is internal infrastructure.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000}
      GF_LOG_LEVEL: warn
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${MONITORING_BIND:-127.0.0.1}:${GRAFANA_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks: [observability]
    logging: *default-logging

  # -----------------------------------------------------------------------
  # Black-box probing. Checks Odoo the way a user does - over HTTP from
  # outside - which catches failures white-box metrics miss entirely, such as
  # an expired certificate or a proxy that stopped forwarding.
  # -----------------------------------------------------------------------
  blackbox:
    image: prom/blackbox-exporter:${BLACKBOX_VERSION:-v0.26.0}
    restart: always
    command:
      - --config.file=/etc/blackbox/blackbox.yml
    volumes:
      - ./monitoring/blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    networks: [observability]
    logging: *default-logging

  # -----------------------------------------------------------------------
  # Exposes OPS's own host metrics. DEV/QA/PROD run their own, installed by
  # the Ansible `monitoring_agent` role.
  # -----------------------------------------------------------------------
  node-exporter:
    image: prom/node-exporter:${NODE_EXPORTER_VERSION:-v1.8.2}
    restart: always
    command:
      - --path.rootfs=/host
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --collector.textfile.directory=/var/lib/node_exporter/textfile_collector
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc|run/credentials)($$|/)
    pid: host
    volumes:
      - /:/host:ro,rslave
      # Where backup.sh writes its metrics, so backup age is alertable.
      - /var/lib/node_exporter/textfile_collector:/var/lib/node_exporter/textfile_collector:ro
    networks: [observability]
    logging: *default-logging

  # -----------------------------------------------------------------------
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:${CADVISOR_VERSION:-v0.52.1}
    restart: always
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks: [observability]
    logging: *default-logging

networks:
  observability:
    driver: bridge

volumes:
  prometheus-data:
  alertmanager-data:
  loki-data:
  grafana-data:
