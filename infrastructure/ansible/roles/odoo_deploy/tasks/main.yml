---
# ===========================================================================
# odoo_deploy - place the application stack on a host
# ===========================================================================
# This role prepares a host to run a deployment. It does NOT deploy an image:
# that is scripts/deploy.sh, driven by the GitHub Actions workflow, so that
# every image change is auditable in one place rather than split between
# Ansible runs and pipeline runs.
# ===========================================================================

- name: Ensure the application directory exists
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0750"

- name: Clone or update the repository
  become: true
  become_user: "{{ deploy_user }}"
  ansible.builtin.git:
    repo: "{{ app_repo_url }}"
    dest: "{{ app_dir }}"
    version: "{{ app_repo_version }}"
    # The working tree is never edited by hand on a server, so discarding
    # local changes is safe and keeps hosts identical.
    force: true
    depth: 50
  # git is installed by roles/common in this same play, so it is not on the
  # host yet under --check.
  when: not ansible_check_mode
  tags: [code]

- name: Ensure scripts are executable after checkout
  ansible.builtin.file:
    path: "{{ app_dir }}/{{ item }}"
    mode: "0755"
  loop:
    - scripts/deploy.sh
    - scripts/rollback.sh
    - scripts/healthcheck.sh
    - scripts/backup.sh
    - scripts/restore.sh
    - scripts/verify-backup.sh
    - scripts/prune-backups.sh
    - scripts/migrate.sh
  # The checkout above is simulated under --check, so none of these paths
  # exist yet.
  when: not ansible_check_mode
  tags: [code]

# ---------------------------------------------------------------------------
# Environment file
# ---------------------------------------------------------------------------
# The only place real secrets land on the host. 0600 and owned by the deploy
# user: readable by the account that runs compose, by nobody else.
- name: Render the environment file
  ansible.builtin.template:
    src: env.j2
    dest: "{{ app_dir }}/.env"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0600"
  no_log: true
  tags: [config, secrets]

- name: Verify the environment file is not world-readable
  ansible.builtin.stat:
    path: "{{ app_dir }}/.env"
  register: env_stat
  tags: [config, secrets]

- name: Fail if the environment file has loose permissions
  ansible.builtin.assert:
    that:
      - env_stat.stat.mode == "0600"
    fail_msg: >-
      {{ app_dir }}/.env is {{ env_stat.stat.mode }}, expected 0600. It holds
      the database and Odoo master passwords.
  # Under --check the file was never written, so stat reports it absent and
  # .mode is undefined - the assertion would fail on a file this run was
  # never going to create.
  when: not ansible_check_mode
  tags: [config, secrets]

# ---------------------------------------------------------------------------
# TLS
# ---------------------------------------------------------------------------
- name: Ensure the TLS directory exists
  ansible.builtin.file:
    path: "{{ app_dir }}/config/nginx/tls"
    state: directory
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0750"
  tags: [tls]

- name: Check whether a certificate is already present
  ansible.builtin.stat:
    path: "{{ app_dir }}/config/nginx/tls/fullchain.pem"
  register: tls_cert
  tags: [tls]

# A self-signed certificate keeps nginx starting in DEV/QA where no public
# DNS name exists. Production must use a real certificate; see docs/security.md.
# Via scripts/gen-local-tls.sh, not a bare `openssl req`. The hand-rolled
# command passed only -subj "/CN=...", producing a certificate with NO
# subjectAltName - and every browser since Chrome 58 ignores the legacy
# Common Name entirely, so such a certificate has no valid names at all and
# fails verification whatever you type. QA answered 200 to `curl -k` and
# showed a name error in a browser. The script also puts the host's own
# addresses in the SAN, which matters because these hosts have no DNS name
# and are reached by IP.
#
# `default(..., true)`, not `default(...)`: prod sets odoo_domain to an EMPTY
# string, and a plain default only replaces an UNDEFINED value.
- name: Generate a self-signed certificate when none exists
  become: true
  become_user: "{{ deploy_user }}"
  when:
    - not tls_cert.stat.exists
    - env_name != "prod" or prod_allow_self_signed | bool
    # openssl would write real files during what is meant to be a dry run.
    - not ansible_check_mode
  ansible.builtin.command:
    cmd: >-
      ./scripts/gen-local-tls.sh
      -d {{ odoo_domain | default('localhost', true) }}
      -a {{ ansible_host }},{{ internal_ip | default(ansible_default_ipv4.address, true) }}
    chdir: "{{ app_dir }}"
    creates: "{{ app_dir }}/config/nginx/tls/fullchain.pem"
  environment:
    # The script carries its own production guard. Wire it to the same
    # variable the assert below uses, so the two cannot disagree.
    ENVIRONMENT: "{{ env_name }}"
    ALLOW_SELF_SIGNED_PROD: "{{ 'yes' if prod_allow_self_signed | bool else 'no' }}"
  tags: [tls]

- name: Refuse to leave production without a real certificate
  ansible.builtin.assert:
    that:
      - tls_cert.stat.exists
    fail_msg: >-
      No TLS certificate at {{ app_dir }}/config/nginx/tls/fullchain.pem.
      Production must not run on a self-signed certificate. Obtain one with
      certbot first - see docs/security.md. To proceed anyway, temporarily,
      while no DNS name exists, set prod_allow_self_signed=true.
  when:
    - env_name == "prod"
    - not (prod_allow_self_signed | bool)
  tags: [tls]

# Loud on EVERY run, not just the first, so a temporary decision does not
# quietly become the permanent state of production.
- name: Warn that production is running on a self-signed certificate
  ansible.builtin.debug:
    msg: >-
      *** {{ inventory_hostname }} is PRODUCTION and is using a SELF-SIGNED
      certificate. Every user will see a browser security warning, and
      clicking through those is the habit phishing depends on. Replace it
      with a real certificate as soon as a DNS name exists -
      docs/runbook.md#renew-ssl. Then set prod_allow_self_signed back to
      false so this guard is live again.
  when:
    - env_name == "prod"
    - prod_allow_self_signed | bool
  tags: [tls]

# ---------------------------------------------------------------------------
# systemd
# ---------------------------------------------------------------------------
# Ensures the stack comes back after a host reboot. Compose's restart policy
# handles container crashes; it does nothing about the machine restarting.
- name: Install the systemd unit
  ansible.builtin.template:
    src: odoo-platform.service.j2
    dest: /etc/systemd/system/odoo-platform.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd
  tags: [systemd]

- name: Enable the service at boot
  ansible.builtin.systemd:
    name: odoo-platform
    enabled: true
    daemon_reload: true
  # The unit file is written by the task above, which check mode only
  # simulates, so there is nothing to enable yet.
  when: not ansible_check_mode
  tags: [systemd]

# ---------------------------------------------------------------------------
- name: Log in to Docker Hub for private image pulls
  become: true
  become_user: "{{ deploy_user }}"
  ansible.builtin.command:
    cmd: docker login -u {{ dockerhub_username }} --password-stdin
    stdin: "{{ dockerhub_token }}"
  when:
    - dockerhub_username is defined
    - dockerhub_token is defined
    # Needs a running Docker daemon, which check mode has not installed.
    - not ansible_check_mode
  no_log: true
  changed_when: false
  tags: [registry]
