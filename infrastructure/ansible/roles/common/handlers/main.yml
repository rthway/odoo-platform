---
- name: Restart sshd
  ansible.builtin.service:
    name: ssh
    state: restarted

- name: Restart fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: restarted
  # fail2ban is installed by this play, so under --check the service does not
  # exist. Handlers are NOT covered by a guard on the task that notifies them.
  when: not ansible_check_mode

- name: Reload ufw
  # `ufw reload` re-applies after.rules, which is where the DOCKER-USER block
  # lives. Restarting Docker would also work but would bounce every container.
  ansible.builtin.command: ufw reload
  changed_when: true
  when: not ansible_check_mode
