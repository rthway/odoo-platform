---
# Overridden per environment in group_vars/ or the inventory.
deploy_user: deploy
app_dir: /opt/odoo-platform
backup_dir: /var/backups/odoo
# The address OPS actually SOURCES traffic from. All four hosts sit behind
# one gateway, and `ip route get` on OPS confirms it uses 192.168.2.56 even
# when dialling a 157.10.100.x address. A ufw rule naming the public address
# would never match, and Prometheus would be firewalled out of every exporter.
monitoring_server_ip: 192.168.2.56

# "prohibit-password" permits key-based root login (needed while a deploy
# account is being established). Set to "no" once that account works.
common_permit_root_login: "prohibit-password"

# TCP forwarding is how an operator tunnels to Grafana or Prometheus, which
# are bound to localhost on OPS. Off elsewhere.
common_allow_tcp_forwarding: false

# Internal addresses of the application hosts, used for the Loki ingress rule
# on OPS. Kept as an explicit list rather than derived from the inventory so
# the firewall does not silently widen when a host is added to a group.
app_host_ips:
  - 192.168.2.6      # dev
  - 192.168.2.52     # qa
  - 192.168.2.217    # prod

# --- Container port protection (DOCKER-USER) --------------------------------
# The private segment all four hosts share. Traffic from here is trusted.
trusted_network: 192.168.2.0/24

# Ports that must NOT be reachable from outside trusted_network. ufw alone
# cannot enforce this - Docker's rules run first - so these are dropped in the
# DOCKER-USER chain instead.
#
# THESE ARE CONTAINER PORTS, NOT PUBLISHED PORTS.
# DNAT happens before the FORWARD chain, so by the time DOCKER-USER sees the
# packet the destination port is the one INSIDE the container. cAdvisor is
# published as 8081:8080, and a rule matching 8081 silently does nothing -
# which is exactly how it stayed reachable after the first attempt at this,
# while node_exporter and postgres_exporter (whose published and container
# ports happen to match) were correctly blocked.
#
# 80 and 443 are deliberately absent: they are meant to be public.
restricted_container_ports:
  - 9100    # node_exporter          (published 9100)
  - 9187    # postgres_exporter      (published 9187) - database internals
  - 8080    # cAdvisor               (published 8081) - container port
  - 8081    # kept as well, harmless, in case a future mapping is 1:1
  - 3100    # Loki - auth_enabled is false, so open to anyone who reaches it
  - 9090    # Prometheus             - no authentication
  - 9093    # Alertmanager           - no authentication, can silence alerts
  - 3000    # Grafana direct, bypassing the nginx front end
