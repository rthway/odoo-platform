---
# ===========================================================================
# docker - install the engine from Docker's own repository
# ===========================================================================
# Distribution packages lag badly and often ship without the compose v2
# plugin, which every script here depends on.
#
# ON --check AGAINST A HOST THAT HAS NEVER BEEN PROVISIONED:
# adding the repository, installing the engine and starting the service are
# all skipped. Check mode does not add the repository, so apt has no
# candidate for docker-ce, so nothing downstream can be evaluated either.
# That is a property of dry-running a virgin host, not a defect here.
#
# A dry run is therefore most useful the SECOND time onwards - which is
# exactly when it matters, because that is when a change is being reviewed
# against a host that already carries state.
# ===========================================================================

- name: Install prerequisites
  ansible.builtin.apt:
    name: [ca-certificates, curl, gnupg]
    state: present
    update_cache: true

- name: Create the keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Add Docker's GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

# deb822_repository, not apt_repository: the latter is deprecated and is
# removed in ansible-core 2.25. The deb822 format also states the signing key
# explicitly rather than encoding it in a one-line string.
- name: Add the Docker repository
  ansible.builtin.deb822_repository:
    name: docker
    types: [deb]
    uris: "https://download.docker.com/linux/ubuntu"
    suites: "{{ ansible_distribution_release }}"
    components: [stable]
    architectures: "{{ ansible_architecture | replace('x86_64', 'amd64') }}"
    signed_by: /etc/apt/keyrings/docker.asc
    state: present
    enabled: true
    install_python_debian: true
  # deb822_repository needs python3-debian on the target. roles/common
  # installs it, but on a host that has never been provisioned check mode
  # only SIMULATES that install, so the module still cannot run - and
  # install_python_debian cannot rescue it, because installing is itself a
  # change check mode will not make. Skipped on a dry run for the same reason
  # as every other task here that depends on a package this play installs.
  when: not ansible_check_mode

- name: Install Docker Engine and the Compose plugin
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true
  # The repository above is skipped under --check, so apt has no candidate
  # for docker-ce and reports "No package matching 'docker-ce'". This is the
  # inherent limit of dry-running a virgin host: check mode cannot validate
  # anything downstream of a package install it did not make. See the note at
  # the top of this file.
  when: not ansible_check_mode

- name: Configure the Docker daemon
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    mode: "0644"
    owner: root
    group: root
    content: |
      {
        "log-driver": "json-file",
        "log-opts": {
          "max-size": "{{ docker_log_max_size }}",
          "max-file": "{{ docker_log_max_file }}"
        },
        "live-restore": {{ docker_live_restore | lower }},
        "userland-proxy": false,
        "no-new-privileges": true,
        "default-ulimits": {
          "nofile": {"Name": "nofile", "Hard": 65535, "Soft": 65535}
        }
      }
  notify: Restart docker

# live-restore keeps containers running across a daemon restart, so a Docker
# upgrade does not have to be an Odoo outage.
- name: Ensure Docker is running and enabled
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true
  # Docker is installed by this same play, so under --check the service does
  # not exist yet.
  when: not ansible_check_mode

- name: Add the deployment user to the docker group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: docker
    append: true
  loop: "{{ docker_users }}"
  # The docker group is created by the engine package, which check mode did
  # not install.
  when: not ansible_check_mode

# Docker socket access is root-equivalent. Recorded here so the security
# documentation and reality do not drift apart.
- name: Note that docker group membership is root-equivalent
  ansible.builtin.debug:
    msg: >-
      {{ item }} is in the docker group, which is equivalent to root on this
      host. This is accepted deliberately so deployments need no sudo; see
      docs/security.md.
  loop: "{{ docker_users }}"

- name: Prune unused images weekly
  ansible.builtin.cron:
    name: docker-prune
    special_time: weekly
    # Images only, and only those older than a week: this must never remove
    # the previous release image that rollback.sh depends on.
    job: "/usr/bin/docker image prune -af --filter 'until=168h' >/dev/null 2>&1"
    user: root
