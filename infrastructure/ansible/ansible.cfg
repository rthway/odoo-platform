[defaults]
inventory = inventory/hosts.ini
roles_path = roles
host_key_checking = True
retry_files_enabled = False
# The community.general.yaml callback was REMOVED in community.general 12.0.0.
# The replacement is the built-in default callback with YAML result
# formatting, which is what that plugin superseded.
stdout_callback = default
result_format = yaml
bin_ansible_callbacks = True
interpreter_python = auto_silent
# Fail the whole play if any host fails. A half-configured fleet is worse
# than an unconfigured one, because nobody knows which state each host is in.
any_errors_fatal = False
forks = 4
timeout = 30

[privilege_escalation]
become = True
become_method = sudo
become_user = root
# Never assume passwordless sudo silently; ask explicitly when needed.
become_ask_pass = False

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=300s -o PreferredAuthentications=publickey
