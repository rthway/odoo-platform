; =========================================================================
; Inventory - EXAMPLE. Copy to hosts.ini and fill in the real SSH user.
; hosts.ini is gitignored: it names real hosts and real accounts.
; =========================================================================
; Deliberately no passwords here. Authentication is by SSH key only, and
; the key path comes from --private-key or ~/.ssh/config.
; =========================================================================

[dev]
odoo-dev ansible_host=157.10.100.223 internal_ip=192.168.2.6

[qa]
odoo-qa ansible_host=157.10.100.230 internal_ip=192.168.2.52

[prod]
odoo-prod ansible_host=157.10.100.231 internal_ip=192.168.2.217

[ops]
odoo-ops ansible_host=157.10.100.232 internal_ip=192.168.2.56

; Hosts that run the Odoo application stack.
[app:children]
dev
qa
prod

; Every managed host, including OPS.
[all_servers:children]
app
ops

[all:vars]
; The deployment account: present on all four hosts, in the `sudo` group,
; with NOPASSWD granted so playbooks run unattended.
;
; internal_ip is the address on the shared 192.168.2.0/24. Hosts always
; source traffic from it, so firewall rules and scrape targets use it;
; ansible_host stays the routable 157.10.100.x address.
;
; Everything below is non-secret and belongs here rather than only in the
; real hosts.ini - the provisioning workflow builds its inventory from THIS
; file, so anything missing here is undefined at run time. That is how
; `deploy_user` came to be undefined mid-play.
ansible_user=devops
ansible_python_interpreter=/usr/bin/python3

deploy_user=devops
app_dir=/opt/odoo-platform
backup_dir=/var/backups/odoo
; OPS as seen from the other hosts, used for the ufw scrape rule.
monitoring_server_ip=192.168.2.56
odoo_image=docker.io/rthway/odoo-platform

[dev:vars]
env_name=dev
odoo_workers=0

[qa:vars]
env_name=qa
odoo_workers=3

[prod:vars]
env_name=prod
; (2 x vCPU) + 1. Confirm with `nproc` on the host before changing.
odoo_workers=5

[ops:vars]
env_name=ops
