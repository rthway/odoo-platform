; =========================================================================
; Inventory - EXAMPLE. Copy to hosts.ini and fill in the real SSH user.
; hosts.ini is gitignored: it names real hosts and real accounts.
; =========================================================================
; Deliberately no passwords here. Authentication is by SSH key only, and
; the key path comes from --private-key or ~/.ssh/config.
; =========================================================================

[dev]
odoo-dev ansible_host=157.10.100.223

[qa]
odoo-qa ansible_host=157.10.100.230

[prod]
odoo-prod ansible_host=157.10.100.231

[ops]
odoo-ops ansible_host=157.10.100.232

; Hosts that run the Odoo application stack.
[app:children]
dev
qa
prod

; Every managed host, including OPS.
[all_servers:children]
app
ops

[all:vars]
; CHANGE THIS to the real deployment account. Root login should be disabled
; by the `common` role once a sudo-capable account exists.
ansible_user=deploy
ansible_python_interpreter=/usr/bin/python3

[dev:vars]
env_name=dev
odoo_workers=0

[qa:vars]
env_name=qa
odoo_workers=3

[prod:vars]
env_name=prod
; (2 x vCPU) + 1. Confirm with `nproc` on the host before changing.
odoo_workers=5

[ops:vars]
env_name=ops
