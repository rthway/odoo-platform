---
# ===========================================================================
# site.yml - provision the fleet
# ===========================================================================
# Prepares hosts to RUN deployments. It never deploys an application image:
# that is scripts/deploy.sh, driven by GitHub Actions, so image changes have
# one audit trail instead of two.
#
#   ansible-playbook site.yml --limit dev          # one environment
#   ansible-playbook site.yml --limit prod --check # dry run first, always
#   ansible-playbook site.yml --tags firewall
# ===========================================================================

# ---------------------------------------------------------------------------
- name: Pre-flight safety checks
  hosts: all_servers
  gather_facts: true
  become: false
  tags: [always]

  tasks:
    - name: Confirm the host is reachable
      ansible.builtin.ping:

    - name: Show what is about to be configured
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }} ({{ ansible_host }}) - {{ env_name }} -
          {{ ansible_distribution }} {{ ansible_distribution_version }},
          {{ ansible_processor_vcpus }} vCPU,
          {{ (ansible_memtotal_mb / 1024) | round(1) }} GB RAM

    # Refuse to run against something that is not the expected distribution
    # rather than half-configuring it and failing midway.
    - name: Require a supported operating system
      ansible.builtin.assert:
        that:
          - ansible_distribution in ["Ubuntu", "Debian"]
        fail_msg: >-
          {{ inventory_hostname }} runs {{ ansible_distribution }}, which these
          roles do not support. They assume apt and Docker's Debian packages.

    # Fail here, before anything is configured, rather than half-way through
    # when odoo_deploy tries to render .env. A host left partly configured is
    # worse than one never touched, because nobody knows which state it is in.
    - name: Require the secrets the application hosts need
      ansible.builtin.assert:
        that:
          - postgres_password is defined
          - postgres_password | length >= 16
          - odoo_admin_passwd is defined
          - odoo_admin_passwd | length >= 16
        fail_msg: >-
          postgres_password and odoo_admin_passwd must be supplied (16+ chars)
          for {{ inventory_hostname }}. They have no defaults on purpose - a
          default password is a password everyone already has. Provide them
          via group_vars/{{ env_name }}/vault.yml and run with
          --ask-vault-pass. Generate values with scripts/gen-secrets.sh.
        quiet: true
      when: "'app' in group_names"

    - name: Require Grafana credentials on the monitoring host
      ansible.builtin.assert:
        that:
          - grafana_admin_user is defined
          - grafana_admin_password is defined
          - grafana_admin_password | length >= 16
        fail_msg: >-
          grafana_admin_user and grafana_admin_password must be supplied for
          {{ inventory_hostname }}. The observability stack refuses to start
          without them rather than defaulting to admin/admin.
        quiet: true
      when: "'ops' in group_names"

    # Sudo is needed by every role that follows. Checking it here turns a
    # confusing mid-play permission error into one clear message.
    - name: Confirm privilege escalation works
      become: true
      ansible.builtin.command: id -u
      register: become_check
      changed_when: false
      failed_when: become_check.stdout | trim != "0"

    # A production change is worth one extra second of deliberation.
    - name: Announce production changes
      ansible.builtin.debug:
        msg: >-
          *** This play targets PRODUCTION ({{ inventory_hostname }}). ***
          Run with --check first if you have not already.
      when: env_name == "prod"

# ---------------------------------------------------------------------------
- name: Baseline hardening on every server
  hosts: all_servers
  become: true
  roles:
    - role: common
      tags: [common]

# ---------------------------------------------------------------------------
- name: Docker engine on every server
  hosts: all_servers
  become: true
  roles:
    - role: docker
      tags: [docker]

# ---------------------------------------------------------------------------
- name: Application stack on DEV, QA and PROD
  hosts: app
  become: true
  roles:
    - role: odoo_deploy
      tags: [app]
    - role: backup_schedule
      tags: [backup]

# ---------------------------------------------------------------------------
- name: Monitoring agents on the application servers
  hosts: app
  become: true
  roles:
    - role: monitoring_agent
      tags: [monitoring]

# ---------------------------------------------------------------------------
- name: Observability stack on OPS
  hosts: ops
  become: true
  tags: [observability]

  tasks:
    # The deploy user gained the `docker` group in the previous play, but
    # ControlPersist keeps the SSH session alive with the OLD membership, so
    # the compose task below fails with "permission denied ...
    # /var/run/docker.sock". Same first-run-only trap as the verification play.
    - name: Reset the connection so new group membership takes effect
      ansible.builtin.meta: reset_connection

    - name: Clone or update the repository on OPS
      become: true
      become_user: "{{ deploy_user }}"
      ansible.builtin.git:
        repo: "{{ app_repo_url }}"
        dest: "{{ app_dir }}"
        version: "{{ app_repo_version }}"
        force: true
        depth: 50
      # git comes from roles/common in this same play.
      when: not ansible_check_mode

    # env-ops.j2, not env.j2: the observability stack needs Grafana
    # credentials and alert routing, not database settings.
    - name: Render the observability environment file
      ansible.builtin.template:
        src: roles/odoo_deploy/templates/env-ops.j2
        dest: "{{ app_dir }}/.env"
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: "0600"
      no_log: true
      # The target directory comes from the clone above.
      when: not ansible_check_mode

    # Alertmanager cannot expand environment variables, so its config has to
    # be rendered with real values before the container starts. Mounting the
    # committed file directly made it crash-loop on "${SMTP_SMARTHOST}:
    # missing port in address".
    # If compose ever starts before the render, Docker creates the missing
    # bind-mount source as a DIRECTORY, and every later render then fails
    # because the destination is not a file. Cheap to prevent, confusing to
    # diagnose from the resulting error.
    - name: Check what is at the Alertmanager config path
      ansible.builtin.stat:
        path: "{{ app_dir }}/monitoring/alertmanager/alertmanager.generated.yml"
      register: am_config_path
      when: not ansible_check_mode

    - name: Remove a directory Docker left where that config belongs
      ansible.builtin.file:
        path: "{{ app_dir }}/monitoring/alertmanager/alertmanager.generated.yml"
        state: absent
      when:
        - not ansible_check_mode
        - am_config_path.stat.isdir | default(false)

    - name: Render the Alertmanager configuration
      ansible.builtin.template:
        # src resolves on the CONTROLLER, not the remote host, so it is a
        # path relative to this playbook - not {{ app_dir }}, which only
        # exists on the target.
        src: ../../monitoring/alertmanager/alertmanager.yml.j2
        dest: "{{ app_dir }}/monitoring/alertmanager/alertmanager.generated.yml"
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: "0640"
      # Deliberately NOT no_log. The rendered file holds secrets, but the
      # module's own error messages are paths and syntax - and a censored
      # failure ("output has been hidden") gives an operator nothing to act
      # on, which cost a full round trip to diagnose here.
      when: not ansible_check_mode

    - name: Create the node_exporter textfile collector directory on OPS
      ansible.builtin.file:
        path: /var/lib/node_exporter/textfile_collector
        state: directory
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: "0755"

    - name: Start the observability stack
      become: true
      become_user: "{{ deploy_user }}"
      community.docker.docker_compose_v2:
        project_src: "{{ app_dir }}"
        files: [compose.observability.yml]
        state: present
        pull: missing
      # Needs a running Docker daemon; check mode has not installed one.
      when: not ansible_check_mode

    - name: Wait for Grafana to become healthy
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ grafana_port | default(3000) }}/api/health"
        status_code: 200
      register: grafana_health
      retries: 20
      delay: 10
      until: grafana_health.status == 200
      when: not ansible_check_mode

    - name: Report the observability endpoints
      ansible.builtin.debug:
        msg: >-
          Grafana, Prometheus and Alertmanager are bound to localhost on
          {{ ansible_host }}. Reach them over an SSH tunnel, for example:
          ssh -L 3000:127.0.0.1:3000 {{ ansible_user }}@{{ ansible_host }}

# ---------------------------------------------------------------------------
- name: Post-run verification
  hosts: app
  become: false
  tags: [verify]

  tasks:
    # The deploy user was added to the `docker` group earlier in this run, but
    # ansible.cfg keeps the SSH connection alive with ControlPersist, so the
    # existing session still carries the OLD group membership and `docker ps`
    # fails with "permission denied ... /var/run/docker.sock". Dropping the
    # connection forces a fresh login that picks the new group up.
    #
    # This is only a first-run problem - on later runs the user is already in
    # the group - which makes it exactly the kind of thing that works when
    # tested and fails on a clean host.
    - name: Reset the connection so new group membership takes effect
      ansible.builtin.meta: reset_connection

    # One guarded block, not a play-level `when` - that is not a valid play
    # attribute and Ansible refuses to parse the playbook at all.
    #
    # Every assertion here concerns something this run creates, so under
    # --check none of it exists and the play would report failures for work
    # that was never meant to have happened yet.
    - name: Verify the host came out as intended
      when: not ansible_check_mode
      block:

        - name: Confirm Docker is usable by the deploy user
          become: true
          become_user: "{{ deploy_user }}"
          ansible.builtin.command: docker ps
          changed_when: false

        - name: Confirm the environment file has strict permissions
          ansible.builtin.stat:
            path: "{{ app_dir }}/.env"
          register: envfile

        - name: Assert the environment file is 0600
          ansible.builtin.assert:
            that:
              - envfile.stat.exists
              - envfile.stat.mode == "0600"
            fail_msg: "{{ app_dir }}/.env is missing or not 0600"

        - name: Confirm the firewall is active
          become: true
          ansible.builtin.command: ufw status
          register: ufw_status
          changed_when: false

        - name: Assert the firewall is enabled
          ansible.builtin.assert:
            that:
              - "'Status: active' in ufw_status.stdout"
            fail_msg: "ufw is not active on {{ inventory_hostname }}"

        - name: Confirm the backup cron entry exists
          become: true
          become_user: "{{ deploy_user }}"
          ansible.builtin.command: crontab -l
          register: crontab_out
          changed_when: false

        - name: Assert the backup job is scheduled
          ansible.builtin.assert:
            that:
              - "'odoo-backup-' + env_name in crontab_out.stdout"
            fail_msg: "No backup cron entry on {{ inventory_hostname }}"
